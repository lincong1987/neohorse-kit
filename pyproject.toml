[project]
name = "neohorse-kit"
version = "0.1.0"
description = "Community toolkit for the NeoHorse JEV decision API (Token Rhythm): multi-key client with caching and metering, typed questions/answers, presets, CLI and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.urls]
Repository = "https://github.com/lincong1987/neohorse-kit"
Issues = "https://github.com/lincong1987/neohorse-kit/issues"
Changelog = "https://github.com/lincong1987/neohorse-kit/releases"

[project.scripts]
neohorse-kit = "neohorse_kit.cli:main"
neohorse-kit-mcp = "neohorse_kit.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neohorse_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
